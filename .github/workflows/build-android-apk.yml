name: Build Anime NOVA Android APK (v3.5)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Pure Native Kotlin + Compose + Media3 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize Native Kotlin + Jetpack Compose + Media3 Sources
        run: |
          node scripts/materialize-kotlin-android.mjs --write
          rm -rf nova2-android/app/src/main/assets/webapp

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Single Unified Signed Native APK (Phone, Tablet & Android TV)
        working-directory: ./nova2-android
        run: |
          gradle assembleRelease --no-daemon
          output_dir="app/build/outputs"
          if [ ! -d "$output_dir" ]; then
            echo "::error::Gradle completed, but no Android build outputs directory was created."
            exit 1
          fi
          mapfile -t apk_files < <(find "$output_dir" -type f -name '*.apk' -path '*/release/*' -print | sort)
          if [ "${#apk_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apk_files[@]}."
            find "$output_dir" -type f -print
            exit 1
          fi
          build_tools="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          aligned_apk="$RUNNER_TEMP/Anime-NOVA-v3.5-aligned.apk"
          signed_apk="$RUNNER_TEMP/Anime-NOVA-v3.5-signed.apk"
          keystore="$RUNNER_TEMP/nova-ci-signing.p12"
          signing_password="$(openssl rand -hex 24)"

          "$build_tools/zipalign" -f -p 4 "${apk_files[0]}" "$aligned_apk"
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$keystore" \
            -storepass "$signing_password" \
            -keypass "$signing_password" \
            -alias nova-ci \
            -dname "CN=Anime NOVA CI, O=Anime NOVA, C=SA" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-type PKCS12 \
            --ks-key-alias nova-ci \
            --ks-pass "pass:$signing_password" \
            --key-pass "pass:$signing_password" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$signed_apk" \
            "$aligned_apk"
          "$build_tools/apksigner" verify --verbose "$signed_apk"
          cp "$signed_apk" ../Anime-NOVA-v3.5.apk

      - name: Upload Single Ready-to-Install Anime NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: Anime-NOVA-v3.5-Android-APK
          path: ./Anime-NOVA-v3.5.apk
          if-no-files-found: error
