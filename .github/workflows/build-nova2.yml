name: Build Nova 2 Android

on:
  push:
    branches: [main]
    paths:
      - "nova2-android/**"
      - ".github/workflows/build-nova2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Nova 2 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: nova2-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova2-debug-apk-${{ github.run_number }}
          path: nova2-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
